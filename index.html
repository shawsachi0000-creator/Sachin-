<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganpati Bappa Morya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.welcome{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}

.welcome img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    padding-bottom:45px;
    background:linear-gradient(
        transparent 55%,
        rgba(0,0,0,.75)
    );
}

.title{
    color:#FFD700;
    font-size:clamp(30px,8vw,70px);
    font-weight:bold;
    text-align:center;
    text-shadow:0 0 15px #000,0 0 25px #D4AF37;
    animation:glow 2s infinite alternate;
}

.subtitle{
    color:white;
    font-size:clamp(16px,4vw,25px);
    margin-top:8px;
    text-align:center;
}

.enter-btn{
    margin-top:20px;
    padding:13px 35px;
    border:2px solid #D4AF37;
    border-radius:40px;
    background:#111;
    color:#FFD700;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.enter-btn:active{
    transform:scale(.95);
}

@keyframes glow{
    from{
        text-shadow:0 0 10px #D4AF37;
    }
    to{
        text-shadow:0 0 30px #FFD700;
    }
}
</style>
</head>

<body>

<div class="welcome">

    <img src="ganpati.png" alt="Ganpati Bappa Morya">

    <div class="overlay">

        <div class="title">
            गणपति बप्पा मोरया 🙏
        </div>

        <div class="subtitle">
            मंगलमूर्ति मोरया
        </div>

        <button class="enter-btn" onclick="enterWebsite()">
            ENTER WEBSITE
        </button>

    </div>

</div>

<script>
function enterWebsite(){
    window.location.href = "home.html";
}
</script>

</body>
</html>
