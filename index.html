<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Friend Biryani Invitation 🍗🍚</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fff3d6,#ffd6a5,#ffb4a2);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    text-align:center;
}

.card{
    width:90%;
    max-width:420px;
    padding:30px 20px;
    background:rgba(255,255,255,.9);
    border-radius:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    position:relative;
    z-index:5;
    animation:pop 1s ease;
}

.biryani{
    font-size:110px;
    animation:bounce 1.5s infinite;
    filter:drop-shadow(0 8px 8px rgba(0,0,0,.2));
}

h1{
    color:#8b3a16;
    font-size:32px;
    margin:10px 0;
}

h2{
    color:#d35400;
    font-size:24px;
    margin:12px 0;
}

p{
    color:#555;
    font-size:18px;
    line-height:1.5;
    margin-bottom:20px;
}

button{
    border:0;
    padding:15px 28px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:#e67e22;
    color:white;
    box-shadow:0 7px 15px rgba(0,0,0,.2);
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    color:#27ae60;
    display:none;
}

.emoji{
    position:absolute;
    font-size:30px;
    animation:float 6s linear infinite;
}

.e1{left:5%;bottom:-50px;animation-delay:0s;}
.e2{left:20%;bottom:-50px;animation-delay:1s;}
.e3{left:75%;bottom:-50px;animation-delay:2s;}
.e4{left:90%;bottom:-50px;animation-delay:3s;}
.e5{left:50%;bottom:-50px;animation-delay:4s;}

@keyframes pop{
    0%{
        transform:scale(.3) rotate(-10deg);
        opacity:0;
    }
    100%{
        transform:scale(1) rotate(0);
        opacity:1;
    }
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0) rotate(-3deg);
    }
    50%{
        transform:translateY(-15px) rotate(3deg);
    }
}

@keyframes float{
    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

@media(max-width:500px){
    .biryani{
        font-size:85px;
    }

    h1{
        font-size:27px;
    }

    h2{
        font-size:21px;
    }

    p{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="emoji e1">🍗</div>
    <div class="emoji e2">❤️</div>
    <div class="emoji e3">🍚</div>
    <div class="emoji e4">😋</div>
    <div class="emoji e5">🌹</div>

    <div class="card">

        <div class="biryani">🍛</div>

        <h1>Oye Bestie! 😎❤️</h1>

        <h2>Ek Important Invitation Hai! 🍗🍚</h2>

        <p>
            Dosti mein ek chhoti si demand hai... 😂<br>
            Mere saath <b>Biryani Khane Chalo!</b> 😋🔥
        </p>

        <button onclick="accept()">
            🍗 Biryani Ke Liye YES!
        </button>

        <div id="result">
            🎉 Done Bestie! 🎉<br>
            Biryani Meri Taraf Se! 😎🍗❤️
        </div>

    </div>

</div>

<script>
function accept(){

    document.getElementById("result").style.display = "block";

    document.querySelector("button").style.display = "none";

    document.querySelector("h2").innerHTML =
        "Biryani Party Confirmed! 🎉🍗";

    for(let i=0;i<25;i++){

        let heart = document.createElement("div");

        heart.innerHTML = ["❤️","🍗","🍚","🎉","😋"][Math.floor(Math.random()*5)];

        heart.style.position = "fixed";
        heart.style.left = Math.random()*100 + "vw";
        heart.style.top = "100vh";
        heart.style.fontSize = (20 + Math.random()*25) + "px";
        heart.style.zIndex = "10";
        heart.style.transition = "transform 3s ease, opacity 3s ease";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.style.transform =
                "translateY(-110vh) rotate(360deg)";
            heart.style.opacity = "0";
        },50);

        setTimeout(()=>{
            heart.remove();
        },3100);
    }
}
</script>

</body>
</html>
