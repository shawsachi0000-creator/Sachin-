<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chanda Request</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    min-height:100vh;
    background:#000;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Dark overlay */
.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.05),
        rgba(0,0,0,0.15) 45%,
        rgba(0,0,0,0.90)
    );
}

/* Message */
.message{
    position:absolute;
    bottom:35px;
    width:100%;
    text-align:center;
    padding:0 15px;
}

.message h1{
    color:#FFD700;
    font-size:clamp(28px,7vw,55px);
    text-shadow:
        0 3px 8px #000,
        0 0 15px #D4AF37;
    margin-bottom:12px;
}

.message p{
    color:white;
    font-size:clamp(17px,4vw,25px);
    margin-bottom:20px;
}

/* Amount buttons */
.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.amount{
    padding:12px 22px;
    border:2px solid #FFD700;
    border-radius:30px;
    background:rgba(0,0,0,.75);
    color:#FFD700;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.amount:active{
    transform:scale(.92);
    background:#FFD700;
    color:#000;
}

#thanks{
    display:none;
    margin-top:15px;
    color:#fff;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <!-- Apni uploaded image ka naam -->
    <img src="13853.png" alt="Namaste">

    <div class="overlay"></div>

    <div class="message">

        <h1>🙏 नमस्ते 🙏</h1>

        <p>
            इस बार कितना चंदा दीजिएगा?
        </p>

        <div class="buttons">

            <button class="amount" onclick="donate(101)">
                ₹101
            </button>

            <button class="amount" onclick="donate(251)">
                ₹251
            </button>

            <button class="amount" onclick="donate(501)">
                ₹501
            </button>

            <button class="amount" onclick="donate(1100)">
                ₹1100
            </button>

        </div>

        <div id="thanks">
            ❤️ बहुत-बहुत धन्यवाद! 🙏
        </div>

    </div>

</div>

<script>
function donate(amount){

    document.getElementById("thanks").style.display = "block";

    document.querySelector(".message p").innerHTML =
        "आपने ₹" + amount + " चुना है ❤️";
}
</script>

</body>
</html>
